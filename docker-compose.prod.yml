services:
  gas-control-api:
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 7777"

  nginx:
    container_name: gas-control-nginx
    build: ./nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - db-network
    depends_on:
      - gas-control-api
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot