services:
  postgres:
    image: postgres:16
    container_name: gas-control-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    env_file:
      - .env
    networks:
      - db-network
    volumes:
      - pgdata-gc:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  gas-control-api:
    build:
      context: .
      dockerfile: ./src/Dockerfile
    container_name: gas-control-backend
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    ports:
      - "7777:7777"
    networks:
      - db-network
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 7777"

volumes:
  pgdata-gc:

networks:
  db-network: