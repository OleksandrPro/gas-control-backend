services:
  postgres:
    image: postgres:16
    container_name: gas-control-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gas_control_database
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - db-network
    volumes:
      - pgdata-gc:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d gas_control_database"]
      interval: 5s
      timeout: 5s
      retries: 5

  gas-control-api:
    build:
      context: .
      dockerfile: ./src/Dockerfile
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    networks:
      - db-network
    depends_on:
      - postgres
    container_name: gas-control-backend
    ports:
      - "7777:7777"
    volumes:
      - ./src:/app/src
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 7777 --reload"

volumes:
  pgdata-gc:

networks:
  db-network: